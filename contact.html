<body>

<header>
  <nav class="nav">
    <a href="index.html" class="logo">respira<span>.</span></a>
    <button class="nav-toggle" aria-label="Abrir menú">☰</button>

      <li><a href="contact.html">Contacto</a></li>
    </ul>
  </nav>
</header>

<section style="padding-top:4rem;">
  <div class="wrap">
    <div class="section-head">
      <span class="eyebrow">Contacto</span>
      <h1>Hablemos</h1>
      <p>Cuéntame brevemente tu situación y te responderé en menos de 48 horas para agendar la sesión inicial.</p>
    </div>

    <!--
      IMPORTANTE: GitHub Pages es estático (sin backend), así que este
      formulario usa Formspree (gratuito) para recibir los mensajes por email.
      Pasos: crea una cuenta en https://formspree.io, crea un formulario nuevo,
      y sustituye TU_ID_DE_FORMSPREE por el ID que te den.
    -->
    <form action="https://formspree.io/f/TU_ID_DE_FORMSPREE" method="POST" style="max-width:520px;">
      <div class="form-field">
        <label for="name">Nombre</label>
        <input type="text" id="name" name="name" required>
      </div>
      <div class="form-field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="form-field">
        <label for="message">Cuéntame tu situación</label>
        <textarea id="message" name="message" required></textarea>
      </div>
      <button type="submit" class="btn btn-solid">Enviar mensaje</button>
    </form>
  </div>
</section>

<footer>
  <div class="wrap footer-grid">
    <p>© 2026 Respira Coaching. Todos los derechos reservados.</p>
    <div style="display:flex;gap:1.5rem;">

      <a href="blog.html">Blog</a>
      <a href="contact.html">Contacto</a>
    </div>
  </div>
</footer>

</body>
