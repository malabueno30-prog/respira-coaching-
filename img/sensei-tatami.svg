<svg viewBox="0 0 480 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ilustración de una figura arrodillada en reverencia sobre un tatami">
  <rect width="480" height="300" fill="#E8DCC8"/>

  <!-- tatami en perspectiva -->
  <g stroke="#5C6B52" stroke-width="2" opacity=".55">
    <line x1="60" y1="255" x2="420" y2="255"/>
    <line x1="90" y1="225" x2="390" y2="225"/>
    <line x1="120" y1="195" x2="360" y2="195"/>
    <line x1="150" y1="165" x2="330" y2="165"/>
  </g>
  <g stroke="#5C6B52" stroke-width="2" opacity=".35">
    <line x1="150" y1="165" x2="60" y2="255"/>
    <line x1="240" y1="150" x2="240" y2="270"/>
    <line x1="330" y1="165" x2="420" y2="255"/>
  </g>

  <!-- sol / círculo zen al fondo -->
  <circle cx="240" cy="90" r="34" fill="none" stroke="#B5654A" stroke-width="3" stroke-dasharray="3 7"/>

  <!-- figura arrodillada en saludo (rei) -->
  <g fill="none" stroke="#5C6B52" stroke-width="6" stroke-linecap="round">
    <circle cx="240" cy="152" r="13" fill="#5C6B52" stroke="none"/>
    <path d="M240 165 L240 195"/>
    <path d="M240 172 L214 188"/>
    <path d="M240 172 L266 188"/>
    <path d="M240 195 L212 226"/>
    <path d="M240 195 L268 226"/>
    <path d="M212 226 L246 232"/>
    <path d="M268 226 L234 232"/>
  </g>

  <!-- obi / cinturón -->
  <path d="M222 190 L258 190" stroke="#B5654A" stroke-width="5" stroke-linecap="round"/>
</svg>
